site_name: LdP Tutorials and Simulators
site_description: Combined cover of tutorials, practical classes and guides for the LdP simulators
docs_dir: docs
site_dir: site
use_directory_urls: false
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  palette:
  - scheme: default
    primary: blue
    accent: blue
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: blue
    accent: blue
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.tabs
  - navigation.sections
  - search.highlight
  - search.suggest
extra_css:
- stylesheets/extra.css
extra:
  polyfills:
  - javascripts/compat.js
plugins:
- search
- offline
- tags
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.highlight
- pymdownx.superfences
