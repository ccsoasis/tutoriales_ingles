<svg viewBox="0 0 500 190" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#fff">
  <title>Conversiones de energía en un aerogenerador</title>
  <desc>Conversiones de energía en un aerogenerador — VIENTO → Energía Cinética Lineal → Energía Cinética Rotativa → Energía Eléctrica → RED ELÉCTRICA</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="#555"/>
    </marker>
  </defs>
  <style>
    .title{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#222}
    .lbl{font-family:Arial,Helvetica,sans-serif;font-size:10px;fill:#333}
    .lbl-b{font-family:Arial,Helvetica,sans-serif;font-size:10px;font-weight:700;fill:#222}
    .lbl-sm{font-family:Arial,Helvetica,sans-serif;font-size:9px;fill:#222}
    .arrow{stroke:#555;stroke-width:1.6;fill:none}
    .box{stroke:#999;stroke-width:1.2;rx:6}
    .blade{stroke:#666;stroke-width:3;stroke-linecap:round}
  </style>

  <text x="250" y="20" text-anchor="middle" class="title">Conversiones de energía en un aerogenerador</text>

  <!-- Caja azul (estrecha): aerogenerador (convertidor 1) -->
  <rect x="20" y="38" width="100" height="102" class="box" fill="#e7f0fb"/>
  <text x="70" y="50" text-anchor="middle" class="lbl-b">CONVERTIDOR</text>
  <text x="70" y="62" text-anchor="middle" class="lbl">lineal a rotativa</text>
  <line x1="70" y1="95" x2="70" y2="132" stroke="#888" stroke-width="3"/>
  <line x1="58" y1="132" x2="82" y2="132" stroke="#888" stroke-width="2"/>
  <line x1="70" y1="95" x2="70" y2="73" class="blade"/>
  <line x1="70" y1="95" x2="89" y2="106" class="blade"/>
  <line x1="70" y1="95" x2="51" y2="106" class="blade"/>
  <circle cx="70" cy="95" r="5" fill="#555"/>

  <!-- Viento -->
  <path d="M 2 95 L 61 95" class="arrow" marker-end="url(#arr)"/>
  <text x="30" y="86" text-anchor="middle" class="lbl-b">VIENTO</text>

  <!-- Caja verde (estrecha): generador eléctrico (convertidor 2) -->
  <rect x="250" y="38" width="110" height="102" class="box" fill="#e8f5e9"/>
  <text x="305" y="50" text-anchor="middle" class="lbl-b">CONVERTIDOR</text>
  <text x="305" y="62" text-anchor="middle" class="lbl">a Energía Eléctrica</text>
  <circle cx="305" cy="95" r="33" fill="#fde0c8" stroke="#e8a04c" stroke-width="1.5"/>
  <text x="305" y="92" text-anchor="middle" class="lbl-sm">GENERADOR</text>
  <text x="305" y="106" text-anchor="middle" class="lbl-sm">ELÉCTRICO</text>

  <!-- Eje rotativo (por encima de la caja verde) -->
  <path d="M 72 95 L 268 95" class="arrow" marker-end="url(#arr)"/>
  <text x="185" y="86" text-anchor="middle" class="lbl-b">EJE ROTATIVO</text>

  <!-- Flecha generador -> red (Energía Eléctrica FUERA de la caja verde) -->
  <path d="M 338 95 L 438 95" class="arrow" marker-end="url(#arr)"/>
    <text x="390" y="78" text-anchor="middle" class="lbl-b">Energía</text>
  <text x="390" y="89" text-anchor="middle" class="lbl-b">Eléctrica</text>

  <!-- Red eléctrica: símbolo de corriente alterna -->
  <circle cx="462" cy="95" r="20" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <path d="M 454 95 Q 458 86 462 95 Q 466 104 470 95" fill="none" stroke="#e8912d" stroke-width="1.6"/>
    <text x="462" y="130" text-anchor="middle" class="lbl-b">RED</text>
  <text x="462" y="141" text-anchor="middle" class="lbl-b">ELÉCTRICA</text>

  <!-- Etiquetas de energía (3 líneas, misma altura de partida) -->
    <text x="70" y="154" text-anchor="middle" class="lbl">Energía</text>
  <text x="70" y="165" text-anchor="middle" class="lbl">Cinética</text>
  <text x="70" y="176" text-anchor="middle" class="lbl">Lineal</text>
    <text x="185" y="154" text-anchor="middle" class="lbl">Energía</text>
  <text x="185" y="165" text-anchor="middle" class="lbl">Cinética</text>
  <text x="185" y="176" text-anchor="middle" class="lbl">Rotativa</text>
</svg>
